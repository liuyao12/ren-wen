name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  readiness:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.pages.outputs.configured }}
    steps:
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh api "repos/$REPOSITORY/pages" > pages.json 2> pages-error.txt && jq -e '.build_type == "workflow"' pages.json >/dev/null; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is unavailable or not enabled. Select GitHub Actions in Settings > Pages, then run this workflow again."
            echo "Pages was not deployed. Enable GitHub Actions in repository Settings > Pages, then rerun Pages. API response:" >> "$GITHUB_STEP_SUMMARY"
            cat pages-error.txt >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: readiness
    if: needs.readiness.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/renwen.py validate
      - uses: actions/configure-pages@v5
      - name: Stage only public reader files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
