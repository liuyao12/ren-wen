name: Pages
run-name: "Pages · ${{ inputs.source_ref && format('CBR {0}', inputs.source_ref) || format('Ren-Wen {0}', github.sha) }}"
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/pages.yml
      - scripts/recover_pages_artifact.py
      - scripts/deploy_pages.py
      - scripts/stage_jinshu065.py
      - scripts/check_jinshu065.py
      - tests/test_stage_jinshu065.py
      - scripts/run_corpus_tests.py
      - tests/test_run_corpus_tests.py
      - tests/test_recover_pages_artifact.py
  workflow_dispatch:
    inputs:
      source_ref:
        description: CBR branch or exact commit to validate and publish
        required: true
        default: 071740c8aa0986162fc8d9848aedae7257c6a27c
        type: string
      validated_run_id:
        description: Optional previous main Pages run with a verified artifact for this exact CBR commit
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the authoritative CBR reader and data
        uses: actions/checkout@v4
        with:
          repository: liuyao12/chinese-biographical-repository
          ref: ${{ inputs.source_ref || '071740c8aa0986162fc8d9848aedae7257c6a27c' }}
      - name: Record the exact CBR source revision
        id: source
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check out the Ren-Wen editorial source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .renwen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check that historical source images remain external
        run: |
          python - <<'PY'
          from pathlib import PurePosixPath
          import subprocess
          import sys

          media = {'.jpg', '.jpeg', '.png', '.gif', '.webp', '.tif', '.tiff', '.jp2', '.pdf'}
          paths = subprocess.check_output([
              'git', 'ls-files', '-z', '--', 'source-evidence', 'sources', 'corpus', 'data/corpus'
          ]).decode().split('\0')
          embedded = [path for path in paths if PurePosixPath(path).suffix.lower() in media]
          if embedded:
              for path in embedded:
                  print(path, file=sys.stderr)
              sys.exit('史料書影請保留外部逐頁連結。')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the complete corpus and dated-name records
        if: ${{ !inputs.validated_run_id }}
        run: |
          python scripts/validate.py
          python scripts/validate_corpus.py
          python scripts/renwen.py validate
          python scripts/profiles.py validate
          python scripts/works.py validate
          python -m scripts.text_units validate
          python -m scripts.round1_validate
          python -m scripts.name_history validate
          python .renwen/scripts/run_corpus_tests.py
          npm test && npm run check
      - name: Install browser verification support
        run: |
          python -m pip install playwright
          UBUNTU_APT_SOURCES=/etc/apt/sources.list.d/ubuntu.sources
          test -r "$UBUNTU_APT_SOURCES"
          sudo apt-get update -qq \
            -o Dir::Etc::sourcelist="$UBUNTU_APT_SOURCES" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y \
            -o Dir::Etc::sourcelist="$UBUNTU_APT_SOURCES" \
            -o Dir::Etc::sourceparts="-" \
            fonts-noto-cjk
      - name: Stage all public pages with an identifiable deployment
        if: ${{ !inputs.validated_run_id }}
        run: |
          mkdir -p _site build
          cp ./*.html _site/
          cp -R assets data _site/
          python .renwen/scripts/stage_jinshu065.py _site
          touch _site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib, json, os, subprocess
          root=Path('_site')
          required=['index.html','library.html','profiles.html','works.html','texts.html']
          for path in required:
              assert (root/path).is_file(), 'Missing public page: '+path
          profile_bytes_saved=0
          for path in (root/'data/corpus/profiles').glob('*.json'):
              original=path.read_bytes()
              profile=json.loads(original)
              serialized = json.dumps(profile, ensure_ascii=False, separators=(',', ':'), allow_nan=False)
              compact = (serialized + '\n').encode('utf-8')
              path.write_bytes(compact)
              profile_bytes_saved+=len(original)-len(compact)
          files=list(root.glob('*.html'))+list((root/'assets').rglob('*'))+list((root/'data').glob('*.json'))+[root/'data/corpus/jinshu/065.json']
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in files if p.is_file()}
          stamp={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'sourceRepository':'liuyao12/chinese-biographical-repository','deploymentRepository':'liuyao12/ren-wen','deploymentWorkflowCommit':os.environ['GITHUB_SHA'],'deploymentRunId':os.environ['GITHUB_RUN_ID'],'release':'cbr-integration-2026.10.09','publishedAt':datetime.now(timezone.utc).isoformat(),'profileJsonFormat':'compact','files':hashes}
          (root/'deployment.json').write_text(json.dumps(stamp,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Staged', len(list(root.rglob('*'))), 'paths; checked',len(hashes),'entry resources; saved',profile_bytes_saved,'profile JSON bytes.')
          PY
      - name: Test the exact staged site before deployment
        if: ${{ !inputs.validated_run_id }}
        run: |
          python -m http.server 8000 --directory _site > build/staged-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python .renwen/scripts/check_jinshu065.py 'http://127.0.0.1:8000/'
          python tests/browser_release.py --url 'http://127.0.0.1:8000/' --output build/staged-browser
          python tests/browser_live.py --url 'http://127.0.0.1:8000/#eccp-zeng-guofan' --output build/staged-browser/map
          python tests/browser_family_layout.py --url 'http://127.0.0.1:8000/#eccp-zeng-guofan' --output build/staged-browser/family
          if [ -f tests/browser_cbr_disclosure.py ]; then
            python tests/browser_cbr_disclosure.py --url 'http://127.0.0.1:8000/'
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: staged_upload
        if: ${{ !inputs.validated_run_id }}
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Recover a previously verified Pages artifact
        if: ${{ inputs.validated_run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
          REQUESTED_SOURCE: ${{ inputs.source_ref }}
          EXPECTED_COMMIT: ${{ steps.source.outputs.sha }}
        run: python .renwen/scripts/recover_pages_artifact.py
      - uses: actions/upload-artifact@v4
        id: recovered_upload
        if: ${{ inputs.validated_run_id }}
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-pages/artifact.tar
          if-no-files-found: error
          retention-days: 1
      - name: Deploy verified reader
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.staged_upload.outputs.artifact_id || steps.recovered_upload.outputs.artifact-id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: python .renwen/scripts/deploy_pages.py
      - name: Verify published commit, reader, family and historical map
        env:
          EXPECTED_COMMIT: ${{ steps.source.outputs.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python tests/browser_release.py --url "$PAGE_URL" --output build/published-browser
          python .renwen/scripts/check_jinshu065.py "$PAGE_URL"
          python tests/browser_live.py --url "${PAGE_URL}#eccp-zeng-guofan" --output build/published-browser/map
          python tests/browser_family_layout.py --url "${PAGE_URL}#eccp-zeng-guofan" --output build/published-browser/family
          if [ -f tests/browser_cbr_disclosure.py ]; then
            python tests/browser_cbr_disclosure.py --url "$PAGE_URL"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-verification
          path: |
            build/staged-browser
            build/published-browser
            build/staged-server.log
            _site/deployment.json
          retention-days: 7
