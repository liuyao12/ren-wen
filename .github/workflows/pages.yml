name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Do not silently skip deployment when hosting is disabled.
      # A successful Pages run must include a successful deployment.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Explain Pages configuration failure
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages configuration failed. Inspect the preceding error; this run did not publish a site."
          {
            echo '## Site not published'
            echo 'GitHub Pages configuration failed. The preceding step contains the actual API error.'
            echo "For an unconfigured site, open https://github.com/${GITHUB_REPOSITORY}/settings/pages and select **GitHub Actions** under **Build and deployment → Source**. Then re-run this workflow."
            echo 'Adding or running a workflow does not by itself enable Pages. If Pages is already enabled, check the API error for permissions or service failures.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/renwen.py validate
      - run: python scripts/profiles.py validate
      - run: python scripts/works.py validate
      - name: Stage only public reader files
        run: |
          mkdir -p _site
          cp index.html profiles.html works.html _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record published URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '## Published\n\n%s\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
