name: Check Chinese year labels
on:
  push:
    branches: [chinese-year-labels]
    paths: ['.github/workflows/check-chinese-years.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checked display changes without modifying source data
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path.cwd().resolve()
          records=json.loads(Path('.maintenance/chinese-year-labels.json').read_text())
          staged={}
          for item in records:
              name=item['path'];p=(root/name).resolve();p.relative_to(root)
              assert name not in staged and (name=='AGENTS.md' or name.startswith(('assets/','docs/','tests/'))),name
              before=p.read_bytes() if p.exists() else b''
              assert (hashlib.sha256(before).hexdigest() if p.exists() else None)==item['before'],f'Stale input: {name}'
              lines=before.decode('utf-8').splitlines(keepends=True);limit=len(lines)
              for start,end,replacement in reversed(item['edits']):
                  assert 0<=start<=end<=limit,(name,start,end)
                  lines[start:end]=[replacement];limit=start
              after=''.join(lines).encode('utf-8')
              assert hashlib.sha256(after).hexdigest()==item['after'],f'Output checksum mismatch: {name}'
              staged[name]=after
          for name,content in staged.items():
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(content)
          print('Applied',len(staged),'display/documentation/test files. No source records changed.')
          PY
      - name: Validate corpus and tests
        run: |
          python scripts/renwen.py validate
          python scripts/profiles.py validate
          python scripts/works.py validate
          python -m scripts.text_units validate
          python -m scripts.round1_validate
          python -m scripts.name_history validate
          python -m unittest discover -s tests -v
          npm test
          npm run check
          git diff --exit-code -- data
      - name: Install browser support
        run: |
          python -m pip install playwright
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Check reader, hover cards, profiles, family and map
        run: |
          mkdir -p build
          python -m http.server 8000 > build/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python tests/browser_release.py --url http://127.0.0.1:8000/ --output build/year-browser
          python tests/browser_live.py --url 'http://127.0.0.1:8000/#eccp-zeng-guofan' --output build/year-browser/map
          python tests/browser_family_layout.py --url 'http://127.0.0.1:8000/#eccp-zeng-guofan' --output build/year-browser/family
      - name: Commit only the tested edits on the feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git branch --show-current)" = chinese-year-labels
          git fetch origin chinese-year-labels
          test "$(git rev-parse origin/chinese-year-labels)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          records=json.loads(Path('.maintenance/chinese-year-labels.json').read_text())
          for item in records:
              assert hashlib.sha256(Path(item['path']).read_bytes()).hexdigest()==item['after'],item['path']
          subprocess.run(['git','add','--',*[r['path'] for r in records]],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Display bracketed Chinese life years and concise age at death'
          git push origin HEAD:chinese-year-labels
          git rev-parse HEAD > build/tested-commit.txt
          git rev-parse HEAD^{tree} > build/tested-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chinese-year-display-checks
          path: |
            build/year-browser
            build/server.log
            build/tested-commit.txt
            build/tested-tree.txt
          retention-days: 7
