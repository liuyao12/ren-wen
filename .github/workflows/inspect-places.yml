name: Inspect place annotation baseline
on:
  push:
    branches: [entity-review-source-navigation]
    paths: ['.github/workflows/inspect-places.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML
      - name: Recover existing editorial changes, preserving sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml, subprocess
          plan=yaml.safe_load(Path('.github/workflows/entity-review-check.yml').read_text())
          step=next(s for s in plan['jobs']['verify']['steps'] if s.get('name')=='Apply the exact reviewed code and documentation')
          subprocess.run(['bash','-e','-c',step['run']],check=True)
          PY
          mkdir -p build
          python -m scripts.editorial_cleanup > build/editorial-report.json
          git diff --exit-code -- data/upstream data/imports
          tar --exclude='./.git' --exclude='./build' --exclude='./.review' --exclude='__pycache__' -czf build/places-baseline.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: places-baseline
          path: |
            build/places-baseline.tar.gz
            build/editorial-report.json
          retention-days: 7
