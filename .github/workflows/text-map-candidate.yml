name: Validate complete text and historical map candidate
on:
  push:
    branches: [text-layers-map]
    paths: ['.github/workflows/text-map-candidate.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: text-layers-map
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble checked code and reproduce source-backed records
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .transport/assemble.py
      - name: Validate complete texts, profiles, quotations and derived database
        run: |
          python scripts/renwen.py validate
          python scripts/profiles.py validate
          python scripts/works.py validate
          python -m scripts.text_units validate
          python -m unittest discover -s tests -v
          npm test && npm run check
          python scripts/renwen.py build-db
          python scripts/profiles.py index-db
          python scripts/works.py index-db
          python -m scripts.text_units index-db
      - run: pip install playwright
      - name: Exercise the served application and actual historical image files
        run: |
          python -m http.server 8000 > build/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python tests/browser_live.py --url http://127.0.0.1:8000/ --output build/browser
      - name: Remove temporary transfer files and commit tested feature tree only
        run: |
          test "$(git branch --show-current)" = text-layers-map
          rm -rf .transport
          rm -f .github/workflows/text-map-sources.yml .github/workflows/reference-map-review.yml .github/workflows/zeng-identity-review.yml .github/workflows/text-map-candidate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete Zeng Guofan entry, nested quoted texts and cropped historical reference maps'
          git push origin HEAD:text-layers-map
          git archive --format=tar.gz -o build/tested-text-map.tar.gz HEAD
          git rev-parse HEAD > build/tested-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tested-text-map-candidate
          path: |
            build/browser
            build/text-map-checksums.json
            build/tested-text-map.tar.gz
            build/tested-commit.txt
            build/server.log
          retention-days: 7
