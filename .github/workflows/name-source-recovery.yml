name: Recover remaining source pages
on:
  push:
    branches: [dated-person-names]
    paths: ['.github/workflows/name-source-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retry only rate-limited pages with conservative backoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, pathlib, json, hashlib, time, os, zipfile, io
          from datetime import datetime, timezone
          out=pathlib.Path('build/recovery');out.mkdir(parents=True,exist_ok=True)
          req=urllib.request.Request('https://api.github.com/repos/liuyao12/ren-wen/actions/artifacts/10093118396/zip',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'Ren-Wen'})
          with urllib.request.urlopen(req,timeout=60) as r:z=zipfile.ZipFile(io.BytesIO(r.read()))
          manifest=json.loads(z.read('manifest.json'))
          todo=[('en',row['title'],row['file']) for row in manifest['pages'] if row['status']=='failed']
          todo += [('zh','清史稿', 'qsg-index.json'),('zh','清史稿/卷405','qsg-405.json'),('zh','清史稿/卷446','qsg-446.json'),('zh','清史稿/卷447','qsg-447.json')]
          results=[]
          for lang,title,file in todo:
            url=f'https://{lang}.wikisource.org/w/api.php?'+urllib.parse.urlencode({'action':'parse','page':title,'prop':'text|wikitext|revid','format':'json','maxlag':5})
            result={'title':title,'file':file,'url':url}
            for attempt in range(6):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Ren-Wen/0.3 (reviewed complete-source reader; https://github.com/liuyao12/ren-wen)'})
                with urllib.request.urlopen(req,timeout=45) as r:raw=r.read(16000000)
                p=json.loads(raw)['parse'];(out/file).write_bytes(raw)
                result.update({'revision':p['revid'],'resolvedTitle':p['title'],'sha256':hashlib.sha256(raw).hexdigest(),'retrieved':datetime.now(timezone.utc).isoformat(),'status':'downloaded-not-reviewed'});break
              except Exception as e:
                if attempt==5:result.update({'status':'failed','error':str(e)})
                else:time.sleep(min(60,10*(attempt+1)))
            results.append(result);print(title,result['status'],flush=True);time.sleep(2)
          (out/'manifest.json').write_text(json.dumps({'pages':results},ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-eccp-and-qsg
          path: build/recovery/
          retention-days: 7
