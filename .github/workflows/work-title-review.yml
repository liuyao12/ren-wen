name: Work title evidence review
on:
  push:
    branches: [work-title-evidence-sept11]
    paths: ['.github/workflows/work-title-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p build
          git archive --format=tar.gz -o build/source.tar.gz HEAD
          git rev-parse HEAD > build/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: work-title-source
          path: |
            build/source.tar.gz
            build/commit.txt
          retention-days: 7
