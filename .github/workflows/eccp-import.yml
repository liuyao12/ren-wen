name: ECCP import review
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/eccp-import.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve source responses for editorial review
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          out = pathlib.Path('build/eccp-import'); out.mkdir(parents=True, exist_ok=True)
          titles = {'eccp': 'Tsêng Chi-tsê', 'eccp-guo-songtao': 'Kuo Sung-tao', 'eccp-dong-xun': 'Tung Hsün', 'eccp-chonghou': "Ch'ung-hou"}
          manifest = []
          for key, name in titles.items():
              title = "Eminent Chinese of the Ch'ing Period/" + name
              params = urllib.parse.urlencode({'action':'parse', 'page':title, 'prop':'text|wikitext|revid', 'format':'json', 'maxlag':5})
              url = 'https://en.wikisource.org/w/api.php?' + params
              try:
                  request = urllib.request.Request(url, headers={'User-Agent':'Ren-Wen/0.2 (source-preservation pilot; https://github.com/liuyao12/ren-wen)'})
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read(5000000)
                  parsed = json.loads(raw)
                  if 'error' in parsed: raise ValueError(parsed['error'])
                  content = parsed['parse']['text']['*']
                  (out / (key + '.response.json')).write_bytes(raw)
                  (out / (key + '.html')).write_text(content, encoding='utf-8')
                  (out / (key + '.wiki')).write_text(parsed['parse']['wikitext']['*'], encoding='utf-8')
                  manifest.append({'id':key, 'title':title, 'apiURL':url, 'revision':parsed['parse']['revid'], 'sha256':hashlib.sha256(raw).hexdigest(), 'retrieved':datetime.now(timezone.utc).isoformat(), 'status':'downloaded-not-reviewed'})
              except Exception as error:
                  manifest.append({'id':key, 'title':title, 'apiURL':url, 'status':'failed', 'error':str(error)})
              time.sleep(1)
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - name: Include the exact code revision used for reproducible review
        run: git archive --format=tar.gz -o build/eccp-import/repository.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: eccp-import-review
          path: build/eccp-import/
          retention-days: 7
      - name: Report failed source retrievals
        run: |
          python - <<'PY'
          import json
          rows = json.load(open('build/eccp-import/manifest.json'))
          assert all(x['status']=='downloaded-not-reviewed' for x in rows), 'Inspect the import artifact; one or more sources could not be retrieved. No corpus files have been changed.'
          PY
