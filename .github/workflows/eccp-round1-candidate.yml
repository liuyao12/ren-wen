name: Validate full ECCP collection
on:
  push:
    branches: [eccp-complete]
    paths: ['.github/workflows/eccp-round1-candidate.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eccp-complete
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: eccp-round1-sources
          path: build/eccp-sources
          github-token: ${{ github.token }}
          repository: liuyao12/ren-wen
          run-id: 34314336843
      - uses: actions/download-artifact@v4
        with:
          name: qsg-round1-sources
          path: build/qsg-sources
          github-token: ${{ github.token }}
          repository: liuyao12/ren-wen
          run-id: 34315005736
      - name: Verify and assemble the locally tested implementation
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          encoded = ''.join((root / f'.transport/final-xz-{i:02}.b64').read_text() for i in range(6))
          packed = base64.b64decode(encoded, validate=True)
          raw = lzma.decompress(packed)
          obj = json.loads(raw)
          assert set(obj) == {'files', 'patch', 'checksums'}
          for name in set(obj['files']) | set(obj['checksums']):
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] not in {'.git', '.github', '.transport'}, name
          patch = root / 'build/collection.patch'
          patch.write_text(obj['patch'], encoding='utf-8')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          for name, content in obj['files'].items():
              p = root/name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content,encoding='utf-8')
          for name, digest in obj['checksums'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == digest, name
          (root/'build/implementation-checksums.json').write_text(json.dumps(obj['checksums'],indent=2),encoding='utf-8')
          print(json.dumps({'verifiedFiles':len(obj['checksums']),'payloadSHA256':hashlib.sha256(raw).hexdigest()}))
          PY
      - name: Import complete preserved sources and produce collection indexes
        run: |
          python -m scripts.eccp_round1 --sources build/eccp-sources --qsg build/qsg-sources
          python -m scripts.round1_metadata
      - name: Validate text, identities, quotations and application
        run: |
          python scripts/renwen.py validate
          python scripts/profiles.py validate
          python scripts/works.py validate
          python -m scripts.text_units validate
          python -m unittest discover -s tests -v > build/python-tests.log 2>&1 || { tail -100 build/python-tests.log; exit 1; }
          tail -8 build/python-tests.log
          npm test > build/js-tests.log 2>&1 || { tail -100 build/js-tests.log; exit 1; }
          tail -12 build/js-tests.log
          npm run check
          python scripts/renwen.py build-db
          python scripts/profiles.py index-db
          python scripts/works.py index-db
          python -m scripts.text_units index-db
      - name: Install browser support
        run: |
          pip install playwright
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Check the served collection, local profiles and QSG links
        run: |
          python -m http.server 8000 > build/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python tests/browser_round1.py --url http://127.0.0.1:8000/ --output build/collection-browser
          python tests/browser_family_layout.py --url http://127.0.0.1:8000/ --output build/family-browser
          python tests/browser_live.py --url 'http://127.0.0.1:8000/#eccp-zeng-guofan' --output build/reader-browser
      - name: Commit validated application and data on the feature branch only
        run: |
          test "$(git branch --show-current)" = eccp-complete
          git restore --source=HEAD --staged --worktree .github/workflows
          rm -rf .transport
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import the complete ECCP collection, proposed QSG matches and county-or-clan profile names'
          git archive --format=tar.gz -o build/tested-collection.tar.gz HEAD
          git rev-parse HEAD > build/tested-commit.txt
          git rev-parse HEAD^{tree} > build/tested-tree.txt
          git push origin HEAD:eccp-complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eccp-complete-validation
          path: |
            build/*-tests.log
            build/implementation-checksums.json
            build/collection-browser
            build/family-browser
            build/reader-browser
            build/tested-collection.tar.gz
            build/tested-commit.txt
            build/tested-tree.txt
            data/editorial/*round1*report*.json
          retention-days: 7
