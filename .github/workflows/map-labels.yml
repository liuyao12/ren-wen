name: Prepare historical map names
on:
  push:
    branches: [entity-review-source-navigation]
    paths: ['.github/workflows/map-labels.yml']
permissions:
  contents: read
jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install geopandas pillow
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - run: python scripts/stage_map_labels.py
      - uses: actions/upload-artifact@v4
        with:
          name: historical-map-names
          path: |
            assets/maps/*-names-*.png
            data/reference-maps.json
            scripts/stage_map_labels.py
          retention-days: 7
