name: Validate Chinese-first interface
on:
  push:
    branches: [chinese-ui]
    paths: ['.github/workflows/chinese-ui-candidate.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidate:
    if: github.ref == 'refs/heads/chinese-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chinese-ui
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact locally tested files with per-file checksums
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          allowed = set('''AGENTS.md README.md assets/app.js assets/entity-hover.js assets/i18n.css assets/i18n.js assets/locale-init.js assets/locale-zh.js assets/person-display.js assets/profile-view.js assets/reader-context.js assets/work-view.js docs/language.md index.html package.json profiles.html scripts/check-js.mjs tests/browser_context.py tests/browser_i18n.py tests/browser_library.py tests/i18n.test.mjs works.html'''.split())
          encoded = ''.join(Path(f'.github/ui-language-part-{i}.txt').read_text().strip() for i in (1, 2, 3))
          payload = lzma.decompress(base64.b64decode(encoded, validate=True))
          digest = lambda data: hashlib.sha256(data).hexdigest()
          assert digest(payload) == 'cb041317e13025af7eb361a1a229283effd8cac730ba4592caa8d66ff57552cf', 'Transport checksum mismatch'
          rows = json.loads(payload)
          assert len(rows) == len(allowed) and {row['path'] for row in rows} == allowed
          staged = []
          root = Path.cwd().resolve()
          for row in rows:
              path = root / row['path']
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              if 'create' in row:
                  assert not path.exists(), f'New path already exists: {path}'
                  text = row['create']
              else:
                  original = path.read_bytes()
                  assert digest(original) == row['baseSha256'], f'Baseline changed: {path}'
                  text = original.decode('utf-8')
                  previous_end = 0
                  for start, end, replacement in row['edits']:
                      assert type(start) is int and type(end) is int
                      assert 0 <= previous_end <= start <= end <= len(text)
                      assert isinstance(replacement, str)
                      previous_end = end
                  for start, end, replacement in reversed(row['edits']):
                      text = text[:start] + replacement + text[end:]
              final = text.encode('utf-8')
              assert digest(final) == row['sha256'], f'Result checksum mismatch: {path}'
              staged.append((path, final))
          for path, final in staged:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(final)
          print(f'Applied {len(staged)} verified interface, documentation, and test files; no corpus changes.')
          PY
      - name: Validate unchanged sources and bilingual application
        run: |
          git diff --exit-code -- data/
          python scripts/renwen.py validate
          python scripts/profiles.py validate
          python scripts/works.py validate
          python -m unittest discover -s tests -v
          npm test
          npm run check
          python scripts/renwen.py build-db
          python scripts/profiles.py index-db
          python scripts/works.py index-db
          git diff --check
      - name: Remove transport files and verify exact tested tree
        run: |
          git rm .github/ui-language-part-1.txt .github/ui-language-part-2.txt .github/ui-language-part-3.txt .github/workflows/chinese-ui-candidate.yml
          git add -A
          test "$(git write-tree)" = 'c8cc381a55f5660286272c8a4b77417ca9f4fac3'
          git diff --cached --exit-code f6fba57ac37ca471d9d42cd7734213d775a3745d -- data/
      - name: Commit tested candidate to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Default to Traditional Chinese with persistent Chinese/English interface switch' -m 'Localize the reader, timeline, map, hover cards, person and work profiles. Preserve all source wording, Chinese names, dates, identifiers, reading context and review drafts. Add localization regression tests and contributor documentation.'
          git push origin HEAD:chinese-ui
          {
            echo '## Verified bilingual UI candidate'
            echo "Commit: $(git rev-parse HEAD)"
            echo "Tree: $(git rev-parse HEAD^{tree})"
            echo '145 automated tests passed. Source data is unchanged. Main has not been modified by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
