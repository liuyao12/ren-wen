name: Text and map source review
on:
  push:
    branches: [text-layers-map]
    paths: ['.github/workflows/text-map-sources.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect file-level terms before selecting any map layer
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, pathlib, json, hashlib, time
          from datetime import datetime, timezone
          out=pathlib.Path('build/source-review');out.mkdir(parents=True,exist_ok=True)
          urls={
            'eccp-zeng-guofan':'https://en.wikisource.org/w/api.php?'+urllib.parse.urlencode({'action':'parse','page':"Eminent Chinese of the Ch'ing Period/Tsêng Kuo-fan",'prop':'text|wikitext|revid','format':'json','maxlag':5}),
            'chgis-1820-eula':'https://dataverse.harvard.edu/api/access/datafile/2966703',
            'chgis-1820-readme':'https://dataverse.harvard.edu/api/access/datafile/2966697',
            'chgis-1911-metadata':'https://dataverse.harvard.edu/api/datasets/:persistentId/?persistentId=doi:10.7910/DVN/HHVVHX',
            'hartwell-metadata':'https://dataverse.harvard.edu/api/datasets/:persistentId/?persistentId=doi:10.7910/DVN/29302'
          }
          manifest=[]
          for name,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Ren-Wen research reader (https://github.com/liuyao12/ren-wen)'})
              with urllib.request.urlopen(req,timeout=40) as r: raw=r.read(8000000)
              (out/(name+'.txt')).write_bytes(raw)
              manifest.append({'id':name,'url':url,'retrieved':datetime.now(timezone.utc).isoformat(),'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)})
            except Exception as e: manifest.append({'id':name,'url':url,'error':str(e)})
            time.sleep(.5)
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - run: pip install playwright
      - name: Exercise the actual deployed map, without mocked fetches
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import pathlib, json, shutil
          out=pathlib.Path('build/source-review');report={'pageErrors':[],'consoleErrors':[]}
          with sync_playwright() as p:
            browser=p.chromium.launch(executable_path=shutil.which('google-chrome') or shutil.which('chromium'),headless=True,args=['--no-sandbox'])
            page=browser.new_page(viewport={'width':1440,'height':1000})
            page.on('pageerror',lambda e:report['pageErrors'].append(str(e)))
            page.on('console',lambda m: report['consoleErrors'].append(m.text) if m.type=='error' else None)
            try:
              response=page.goto('https://liuyao12.github.io/ren-wen/',wait_until='networkidle',timeout=45000)
              report['httpStatus']=response.status
              page.wait_for_timeout(2000)
              report['interactiveMapCount']=page.locator('#historic-map').count()
              report['legacyMapVisible']=page.locator('#map').is_visible()
              if report['interactiveMapCount']:
                m=page.locator('#historic-map');report['initialView']=m.get_attribute('viewBox')
                b=m.bounding_box();x=b['x']+b['width']*.6;y=b['y']+b['height']*.6
                page.mouse.move(x,y);page.mouse.down();page.mouse.move(x+50,y+20,steps=8);page.mouse.up()
                report['dragAtOverviewView']=m.get_attribute('viewBox')
                page.locator('#context-zoom-in').click();report['buttonZoomView']=m.get_attribute('viewBox')
                page.mouse.move(x,y);page.mouse.wheel(0,-350);page.wait_for_timeout(200);report['wheelZoomView']=m.get_attribute('viewBox')
                report['boundaryCount']=page.locator('#historical-boundaries path').count()
              page.screenshot(path=str(out/'live-map.png'))
            except Exception as e:report['testError']=str(e)
            browser.close()
          (out/'live-map-report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          PY
      - run: git archive --format=tar.gz -o build/source-review/repository.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-map-source-review
          path: build/source-review
          retention-days: 7
