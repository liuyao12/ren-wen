name: Historical reference map review
on:
  push:
    branches: [text-layers-map]
    paths: ['scripts/stage_reference_maps.py', '.github/workflows/reference-map-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install geopandas Pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: python scripts/stage_reference_maps.py
      - uses: actions/upload-artifact@v4
        with:
          name: historical-reference-map-images
          path: build/reference-maps
          retention-days: 7
