name: Verify places and historical names
on:
  push:
    branches: [places-jurisdiction-names]
    paths: ['.github/workflows/check-places.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: efeddebc551bf3506dea047c1e026ce12fbbe288
          path: _candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation and cartographic preparation support
        run: |
          python -m pip install PyYAML geopandas pillow playwright
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Restore the saved editorial work and apply exact place changes
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,subprocess,yaml
          from pathlib import Path
          root=Path('_candidate').resolve()
          plan=yaml.safe_load((root/'.github/workflows/entity-review-check.yml').read_text())
          step=next(s for s in plan['jobs']['verify']['steps'] if s.get('name')=='Apply the exact reviewed code and documentation')
          subprocess.run(['bash','-e','-c',step['run']],cwd=root,check=True)
          encoded=''.join(Path(f'.review/places-{i:02}.txt').read_text().strip() for i in (1,2))
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='c8e96e8b7d830d0b650cbb6a25dfd87c92e4083b393bd57603dc3e530e8bcc36','Transport checksum mismatch'
          raw=lzma.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=='c2dedb7cbf90bcf49f9673552a5b7a1801670c65ac99a2cf9345afa8fd0cd6d7'
          staged={}
          for item in json.loads(raw):
              name=item['path'];path=(root/name).resolve();path.relative_to(root)
              assert not name.startswith(('.git','.review/','data/','build/')) and name not in staged
              before=path.read_bytes() if path.exists() else b''
              assert (hashlib.sha256(before).hexdigest() if path.exists() else None)==item['before'],f'Stale input: {name}'
              text=before.decode('utf8');limit=len(text)
              for start,end,replacement in reversed(item['edits']):
                  assert 0<=start<=end<=limit
                  text=text[:start]+replacement+text[end:];limit=start
              after=text.encode('utf8')
              assert hashlib.sha256(after).hexdigest()==item['after'],f'Output mismatch: {name}'
              staged[name]=after
          for name,content in staged.items():
              path=root/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(content)
          print('Applied',len(staged),'checksummed files.')
          path=root/'tests/browser_live.py'
          text=path.read_text()
          old=r'''page.evaluate(\"w=>window.dispatchEvent(new CustomEvent('renwen:navigate',{detail:{witness:w}}))\",'qsg')'''
          assert text.count(old)==1, 'Unexpected map test baseline'
          path.write_text(text.replace(old,old.replace(chr(92)+chr(34),chr(34))))
          subprocess.run(['python','-m','compileall','-q','scripts','tests'],cwd=root,check=True)
          PY
      - name: Generate source-preserving proposals and cropped dated labels
        working-directory: _candidate
        run: |
          set -o pipefail
          mkdir -p build
          python -m scripts.editorial_cleanup | tee build/editorial-report.json
          python -m scripts.place_review | tee build/place-report.json
          python scripts/stage_map_labels.py | tee build/map-label-report.txt
          git diff --exit-code -- data/upstream data/imports
      - name: Validate texts, records and regression tests
        working-directory: _candidate
        run: |
          python scripts/renwen.py validate
          python scripts/profiles.py validate
          python scripts/works.py validate
          python -m scripts.text_units validate
          python -m scripts.round1_validate
          python -m scripts.name_history validate
          python -m unittest discover -s tests -v
          npm test && npm run check
      - name: Test reader, navigation and names over actual HTTP
        working-directory: _candidate
        run: |
          set -o pipefail
          python -m http.server 8000 > build/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python tests/browser_release.py --url 'http://127.0.0.1:8000/' --output build/places-browser 2>&1 | tee build/browser-release.log
          python tests/browser_live.py --url 'http://127.0.0.1:8000/#eccp-zeng-guofan' --output build/places-browser/map 2>&1 | tee build/browser-map.log
          python tests/browser_family_layout.py --url 'http://127.0.0.1:8000/#eccp-zeng-guofan' --output build/places-browser/family 2>&1 | tee build/browser-family.log
      - name: Save only the tested source to the feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git branch --show-current)" = places-jurisdiction-names
          git fetch origin places-jurisdiction-names
          test "$(git rev-parse origin/places-jurisdiction-names)" = "$EXPECTED_HEAD"
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='.review/' --exclude='.transport/' --exclude='.release/' --exclude='_candidate/' --exclude='_site/' --exclude='build/' --exclude='node_modules/' --exclude='__pycache__/' _candidate/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github' ':(exclude).review' ':(exclude)build' ':(exclude)_candidate' ':(exclude)_site' ':(exclude)node_modules'
          git commit -m 'Add source-linked place proposals and dated map names; integrate reviewed entity navigation'
          git push origin HEAD:places-jurisdiction-names
          mkdir -p build
          git rev-parse HEAD > build/tested-commit.txt
          git rev-parse HEAD^{tree} > build/tested-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: places-verification
          path: |
            build/tested-commit.txt
            build/tested-tree.txt
            _candidate/build/places-browser
            _candidate/build/place-report.json
            _candidate/build/editorial-report.json
            _candidate/build/map-label-report.txt
            _candidate/build/server.log
            _candidate/build/browser-*.log
            _candidate/data/reference-maps.json
          retention-days: 7
