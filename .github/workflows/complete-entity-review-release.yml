name: Complete entity review release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/complete-entity-review-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: complete-entity-review-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard existing editorial work
        run: |
          python - <<'PY'
          import subprocess
          baseline='3880c5a3404a24c2fe94b9a50ac4cb262a9ea1ef'
          subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD'],check=True)
          changed=set(subprocess.check_output(['git','diff','--name-only',baseline,'HEAD'],text=True).splitlines())
          allowed={'.github/workflows/complete-entity-review-release.yml'}
          if changed-allowed:
              raise SystemExit('Main contains other work; refusing replacement: '+repr(sorted(changed-allowed)))
          PY
      - uses: actions/checkout@v4
        with:
          ref: entity-review-source-navigation
          path: _candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification support
        run: |
          python -m pip install PyYAML playwright
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Recover the saved correction batch without duplicating it
        run: |
          python - <<'PY'
          import json, subprocess, yaml
          from pathlib import Path
          root=Path('_candidate').resolve()
          staged='7dfd071ea9ce39962c858ebb023c0484964a2b86'
          subprocess.run(['git','merge-base','--is-ancestor',staged,'HEAD'],cwd=root,check=True)
          plan=yaml.safe_load((root/'.github/workflows/entity-review-check.yml').read_text())
          jobs=plan['jobs']; job=jobs.get('verify')
          if not job: raise SystemExit('Saved verification job is missing')
          steps={s.get('name'):s for s in job['steps'] if s.get('name')}
          required=['Apply the exact reviewed code and documentation','Preserve source wording while revising identifications','Validate corpus and every regression','Test navigation, reviewed links, profiles and map through actual HTTP']
          for name in required:
              if name not in steps or not isinstance(steps[name].get('run'),str):
                  raise SystemExit('Missing saved verification contract: '+name)
          changed=subprocess.check_output(['git','diff','--name-only',staged,'HEAD'],cwd=root,text=True).splitlines()
          editorial=[p for p in changed if not p.startswith(('.github/','.transport/','.release/'))]
          if not editorial:
              for name in required[:2]:
                  subprocess.run(['bash','-e','-o','pipefail','-c',steps[name]['run']],cwd=root,check=True)
          else:
              print('Using already assembled feature-branch work; all checks remain mandatory.')
          Path('build').mkdir(exist_ok=True)
          record={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip(),'steps':steps}
          Path('build/entity-release-plan.json').write_text(json.dumps(record,ensure_ascii=False,indent=2))
          PY
      - name: Validate source preservation and all regression tests
        run: |
          python - <<'PY'
          import json, subprocess
          plan=json.load(open('build/entity-release-plan.json'))
          script=plan['steps']['Validate corpus and every regression']['run']
          subprocess.run(['bash','-e','-o','pipefail','-c',script],cwd='_candidate',check=True)
          PY
      - name: Run the saved browser verification suite
        run: |
          python - <<'PY'
          import json, subprocess
          plan=json.load(open('build/entity-release-plan.json'))
          script=plan['steps']['Test navigation, reviewed links, profiles and map through actual HTTP']['run']
          subprocess.run(['bash','-e','-o','pipefail','-c',script],cwd='_candidate',check=True)
          PY
      - name: Let the older ordinary Pages run finish before replacing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          path='repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/pages.yml/runs?branch=main&per_page=20'
          for attempt in range(90):
              runs=json.loads(subprocess.check_output(['gh','api',path],text=True))['workflow_runs']
              pending=[r for r in runs if r['head_sha']==os.environ['GITHUB_SHA'] and r['status']!='completed']
              if not pending: break
              time.sleep(5)
          else: raise SystemExit('An earlier Pages run is still active; refusing a competing deployment')
          PY
      - name: Integrate only the tested application and editorial files
        env:
          EXPECTED_MAIN: ${{ github.sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          python - <<'PY'
          import shutil, subprocess
          from pathlib import Path
          root=Path.cwd(); candidate=root/'_candidate'
          excluded={'.git','.github','.transport','.release','_candidate','_site','build','node_modules','__pycache__'}
          names={p.name for p in root.iterdir() if p.name not in excluded}|{p.name for p in candidate.iterdir() if p.name not in excluded}
          for name in sorted(names):
              src=candidate/name; dst=root/name
              if dst.is_dir(): shutil.rmtree(dst)
              elif dst.exists(): dst.unlink()
              if src.is_dir(): shutil.copytree(src,dst,ignore=shutil.ignore_patterns('__pycache__','*.pyc'))
              elif src.is_file(): shutil.copy2(src,dst)
          for path in ('index.html','library.html','profiles.html','works.html','texts.html'):
              if not (root/path).is_file(): raise SystemExit('Missing required page '+path)
          tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          paths=set(names)|{p.split('/')[0] for p in tracked if p.split('/')[0] not in excluded}
          paths=[p for p in sorted(paths) if (root/p).exists() or any(t==p or t.startswith(p+'/') for t in tracked)]
          subprocess.run(['git','add','-A','--',*paths],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Publish tested source navigation and contextual entity corrections' -m 'Preserve all source wording and typography. Retain unresolved links in the review queue rather than asserting false identities. Keep printed redirects as archival evidence and lookup aliases, not reading entries.'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > build/entity-published-commit.txt
      - name: Stage every public page with a deployment fingerprint
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from datetime import datetime, timezone
          from pathlib import Path
          site=Path('_site')
          if site.exists(): shutil.rmtree(site)
          site.mkdir()
          for p in Path('.').glob('*.html'): shutil.copy2(p,site/p.name)
          for name in ('assets','data'): shutil.copytree(name,site/name)
          (site/'.nojekyll').write_text('')
          files=list(site.glob('*.html'))+list((site/'assets').rglob('*'))+list((site/'data').glob('*.json'))
          stamp={'commit':Path('build/entity-published-commit.txt').read_text().strip(),'release':'r2026.09.10','publishedAt':datetime.now(timezone.utc).isoformat(),'files':{str(p.relative_to(site)):hashlib.sha256(p.read_bytes()).hexdigest() for p in files if p.is_file()}}
          (site/'deployment.json').write_text(json.dumps(stamp,ensure_ascii=False,indent=2)+'\n')
          Path('build/entity-deployment.json').write_text(json.dumps(stamp,ensure_ascii=False,indent=2))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy the checked editorial release
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live commit and browser behavior
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib, json, os, shlex, subprocess, time, urllib.request
          from pathlib import Path
          base=os.environ['LIVE_URL'].rstrip('/')+'/'
          expected=json.load(open('build/entity-deployment.json'))
          def read(path):
              url=base+path+'?verify='+expected['commit']
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=60) as response: return response.read()
          for attempt in range(30):
              try:
                  actual=json.loads(read('deployment.json'))
                  if actual['commit']==expected['commit']: break
              except Exception: pass
              time.sleep(5)
          else: raise SystemExit('Live deployment does not match the tested commit')
          for path,digest in expected['files'].items():
              if path.endswith('.html') or path.startswith('assets/') and path.endswith(('.js','.css')):
                  if hashlib.sha256(read(path)).hexdigest()!=digest:
                      raise SystemExit('Live resource differs from tested file: '+path)
          plan=json.load(open('build/entity-release-plan.json'))
          script=plan['steps']['Test navigation, reviewed links, profiles and map through actual HTTP']['run']
          env=dict(os.environ,EXPECTED_COMMIT=expected['commit'])
          commands=[]
          for line in script.splitlines():
              tokens=shlex.split(line)
              if len(tokens)<2 or tokens[0] not in ('python','python3') or not tokens[1].startswith('tests/browser') or not tokens[1].endswith('.py'): continue
              if '--url' not in tokens or '--output' not in tokens: raise SystemExit('Unsupported browser test arguments')
              i=tokens.index('--url')+1
              tokens[i]=tokens[i].replace('http://127.0.0.1:8000/',base).replace('http://localhost:8000/',base)
              if not tokens[i].startswith(base): raise SystemExit('Unrecognized browser URL')
              j=tokens.index('--output')+1
              tokens[j]='build/entity-live-browser/'+Path(tokens[1]).stem
              subprocess.run(tokens,env=env,check=True)
              commands.append(tokens[1])
          if len(commands)<3: raise SystemExit('Expected at least three saved live browser suites')
          Path('build/entity-live-report.json').write_text(json.dumps({'passed':True,'commit':expected['commit'],'url':base,'browserSuites':commands},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completed-entity-review-release
          path: |
            build/entity-deployment.json
            build/entity-published-commit.txt
            build/entity-live-report.json
            build/entity-live-browser/
            _candidate/build/
          retention-days: 7
